apiVersion: apps/v1
kind: Deployment

metadata:
  name: opensearch-dashboards
  namespace: streaming-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch-dashboards

  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch-dashboards

    spec:
      containers:
        - name: opensearch-dashboards
          image: opensearchproject/opensearch-dashboards:latest

          ports:
            - name: http
              containerPort: 5601

          startupProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 20
            failureThreshold: 3

          env:
            - name: OPENSEARCH_HOSTS
              value: '["http://opensearch-service:9200"]'
            - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
              value: "true"
