apiVersion: apps/v1
kind: Deployment

metadata:
  name: consumer
  namespace: streaming-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: consumer

  template:
    metadata:
      labels:
        app.kubernetes.io/name: consumer

    spec:
      containers:
        - name: consumer
          image: consumer:v1.0.0

          env:
            - name: Kafka__BootstrapServers
              value: redpanda-service:9092

            - name: Kafka__GroupId
              value: consumer-group

            - name: Kafka__Topic
              value: streaming-events

            - name: OpenSearch__Url
              value: http://opensearch-service:9200

            - name: OpenSearch__IndexName
              value: messages
