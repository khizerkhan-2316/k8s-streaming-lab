apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: opensearch
  namespace: streaming-platform
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: streaming-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch

  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/part-of: streaming-platform

    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.19.0

          ports:
            - name: http
              containerPort: 9200

          env:
            - name: discovery.type
              value: single-node

            - name: plugins.security.disabled
              value: "true"

            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-admin-secret
                  key: password

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            failureThreshold: 3

          volumeMounts:
            - name: opensearch-data
              mountPath: /usr/share/opensearch/data

  volumeClaimTemplates:
    - metadata:
        name: opensearch-data
      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 5Gi
