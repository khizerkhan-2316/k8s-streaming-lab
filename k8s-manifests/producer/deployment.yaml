apiVersion: apps/v1
kind: Deployment

metadata:
  name: producer
  namespace: streaming-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: producer

  template:
    metadata:
      labels:
        app.kubernetes.io/name: producer

    spec:
      containers:
        - name: producer
          image: producer:v1.0.0

          env:
            - name: Kafka__BootstrapServers
              value: redpanda-service:9092

            - name: Kafka__Topic
              value: streaming-events
