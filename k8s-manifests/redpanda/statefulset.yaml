apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: redpanda
  namespace: streaming-platform
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: streaming-platform

spec:
  serviceName: redpanda-service
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda

  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/part-of: streaming-platform

    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
          command:
            - rpk
            - redpanda
            - start
            - --smp=1
            - --memory=1G
            - --overprovisioned
            - --node-id=0
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda-service:9092

          ports:
            - name: kafka
              containerPort: 9092

          startupProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data

  volumeClaimTemplates:
    - metadata:
        name: redpanda-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
